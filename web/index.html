<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Deary - Takvim bazlı huzurlu ve büyülü dijital anı defteri.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Deary">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Deary - Dijital Günlük</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F1EDFB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #F1EDFB 0%, #E2DCF7 100%);
      transition: opacity 0.4s ease-out;
      z-index: 99999;
    }
    #loading img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 10px 25px rgba(108, 92, 231, 0.3);
      animation: pulse 2s infinite ease-in-out;
    }
    #loading h2 {
      margin-top: 18px;
      font-size: 20px;
      color: #4834D4;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="favicon.png" alt="Deary Logo" />
    <h2>Deary</h2>
  </div>
  <script>
    window.addEventListener('load', function() {
      // Flutter yüklendiğinde loading'i kaldır
      setTimeout(function() {
        var loader = document.getElementById('loading');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() { loader.remove(); }, 400);
        }
      }, 500);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
